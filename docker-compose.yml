services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3049:3000"
    volumes:
      - ~/.pi/agent/sessions:/sessions:ro
      - ./data:/rails/data
    environment:
      - RAILS_ENV=production
      - RAILS_LOG_TO_STDOUT=1
      - SESSIONS_ROOT=/sessions
      - DATABASE_PATH=/rails/data/pi_board.db
      - PORT=3000
      - RAILS_MASTER_KEY=${RAILS_MASTER_KEY}
